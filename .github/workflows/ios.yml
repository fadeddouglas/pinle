name: iOS build

on:
  workflow_dispatch:

jobs:
  ipa:
    runs-on: macos-latest
    if: ${{ secrets.APPSTORE_ISSUER_ID != '' }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm test
      - run: npm run cap:sync
      - name: Install Apple certificate and profile
        env:
          APPSTORE_CERTIFICATE_BASE64: ${{ secrets.APPSTORE_CERTIFICATE_BASE64 }}
          APPSTORE_CERTIFICATE_PASSWORD: ${{ secrets.APPSTORE_CERTIFICATE_PASSWORD }}
          APPSTORE_PROVISION_BASE64: ${{ secrets.APPSTORE_PROVISION_BASE64 }}
        run: |
          CERT="$RUNNER_TEMP/build.p12"
          PROFILE_DIR="$HOME/Library/MobileDevice/Provisioning Profiles"
          mkdir -p "$PROFILE_DIR"
          echo "$APPSTORE_CERTIFICATE_BASE64" | base64 --decode > "$CERT"
          echo "$APPSTORE_PROVISION_BASE64" | base64 --decode > "$PROFILE_DIR/pinle.mobileprovision"
          security create-keychain -p "" "$RUNNER_TEMP/app-signing.keychain-db"
          security set-keychain-settings -lut 21600 "$RUNNER_TEMP/app-signing.keychain-db"
          security unlock-keychain -p "" "$RUNNER_TEMP/app-signing.keychain-db"
          security import "$CERT" -P "$APPSTORE_CERTIFICATE_PASSWORD" -A -t cert -f pkcs12 -k "$RUNNER_TEMP/app-signing.keychain-db"
          security list-keychain -d user -s "$RUNNER_TEMP/app-signing.keychain-db"
      - name: Archive
        run: |
          xcodebuild -project ios/App/App.xcodeproj -scheme App -sdk iphoneos -configuration Release -archivePath "$RUNNER_TEMP/Pinle.xcarchive" archive CODE_SIGN_STYLE=Automatic DEVELOPMENT_TEAM="${{ secrets.APPLE_TEAM_ID }}"
      - name: Export IPA
        run: |
          cat > "$RUNNER_TEMP/export.plist" <<'EOF'
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
            <key>method</key>
            <string>app-store-connect</string>
            <key>signingStyle</key>
            <string>automatic</string>
          </dict>
          </plist>
          EOF
          xcodebuild -exportArchive -archivePath "$RUNNER_TEMP/Pinle.xcarchive" -exportPath "$RUNNER_TEMP/export" -exportOptionsPlist "$RUNNER_TEMP/export.plist"
      - uses: actions/upload-artifact@v4
        with:
          name: Pinle.ipa
          path: ${{ runner.temp }}/export/*.ipa
